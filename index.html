<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Add this before your script tags -->
    <style>
      /* Minimal styling to prevent FOUC */
      .js-loading {
        opacity: 0;
      }
      .js-loading-complete {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }
    </style>
    <title>Fieldbook</title>
  </head>
  <body
    class="bg-gradient-to-br from-purple-600 to-blue-200 bg-fixed h-screen js-loading"
  >
    <div id="root"></div>
    <script>
      // Add this before your main script
      ;(function () {
        function checkStylesAndReload() {
          console.log("checkstyles")
          // Check for any loaded stylesheets
          const sheets = Array.from(document.styleSheets)
          const hasStyles = sheets.some((sheet) => {
            try {
              return sheet.cssRules && sheet.cssRules.length > 0
            } catch (e) {
              return false
            }
          })
          console.log({ hasStyles })

          if (!hasStyles && "serviceWorker" in navigator) {
            // No styles found, force reload
            window.location.reload()
          } else {
            // Styles found, show content
            document.body.classList.replace("js-loading", "js-loading-complete")
          }
        }

        // Check after JavaScript has had a chance to load CSS
        setTimeout(checkStylesAndReload, 2000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
