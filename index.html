<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Add this before your script tags -->
    <style>
      /* Initial state hides the main content but shows the spinner */
      #root {
        opacity: 0;
      }
      .js-loading-complete #root {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }

      /* Loading spinner container */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      /* The spinner itself */
      .loading-spinner::after {
        content: "";
        display: block;
        width: 33vh;
        height: 33vh;
        max-width: 240px;
        max-height: 240px;
        border-radius: 50%;
        border: 3px solid #e5e5e5;
        border-top-color: #9333ea;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Hide spinner when styles are loaded */
      .js-loading-complete .loading-spinner {
        display: none;
      }
    </style>
    <title>Fieldbook</title>
  </head>
  <body class="bg-gradient-to-br from-purple-600 to-blue-200 bg-fixed h-screen">
    <div id="debug-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
